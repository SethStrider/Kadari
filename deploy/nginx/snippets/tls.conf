# TLS between Cloudflare and this origin (GL-06).
#
# - Server certificate: a Cloudflare Origin CA certificate for *.<domain> (Cloudflare SSL/TLS -> Origin Server),
#   with SSL mode "Full (strict)" in Cloudflare.
# - Client certificate: Authenticated Origin Pulls. Cloudflare presents its origin-pull certificate on every
#   request; nginx refuses any connection that does not. Anyone who finds the VPS IP gets a TLS error, never the
#   app — the WAF, rate rules and Access cannot be bypassed.

ssl_certificate         /etc/nginx/certs/origin.pem;
ssl_certificate_key     /etc/nginx/certs/origin.key;
ssl_client_certificate  /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
ssl_verify_client       on;

ssl_protocols           TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache       shared:SSL:10m;
ssl_session_timeout     1d;
ssl_session_tickets     off;
