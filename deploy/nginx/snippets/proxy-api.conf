# Forward to Kadari.WebApi (GL-06). The API trusts exactly one proxy hop — this one, identified by the edge
# network's subnet (ReverseProxy:KnownNetworks) — so what this file sends is what the API believes.

# Resolve at request time through Docker's DNS, so nginx starts even while the API is still booting.
resolver 127.0.0.11 valid=30s ipv6=off;
set $kadari_api http://webapi:8080;
proxy_pass $kadari_api;
proxy_http_version 1.1;

proxy_set_header Host              $host;
# $remote_addr is the visitor (restored from CF-Connecting-IP by cloudflare-real-ip.conf). Overwrite, never append:
# an appended chain would let a client prepend its own "IP".
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header CF-Connecting-IP  "";

# Uploads and report generation are allowed 120 s by the API (GL-18); give them a little more here.
proxy_connect_timeout 5s;
proxy_send_timeout    125s;
proxy_read_timeout    125s;
