# Security headers for every response from this server block (GL-15/19). Set here, once — the SPA containers and the
# API do not repeat them. nginx does not inherit add_header into a location that sets its own, so locations that
# include this file must not use add_header themselves.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Camera for Kadari capture (same origin only); nothing else.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;

# The SPA is self-hosted apart from Google Fonts. 'wasm-unsafe-eval' lets the self-hosted MediaPipe detector compile
# its WebAssembly (it is not 'unsafe-eval'); blob: workers are MediaPipe's. style 'unsafe-inline' covers React and
# GSAP style attributes. Tokens can still only be sent to 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
