# The real client address (GL-06). Cloudflare puts the visitor's IP in CF-Connecting-IP; nginx believes it ONLY
# when the TCP peer is one of Cloudflare's published ranges, so a request that reaches the origin some other way
# cannot pick its own IP. Rate limits and session audit IPs downstream then see the visitor, not Cloudflare.
#
# Source: https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6 (checked 2026-09-29).
# Refresh with deploy/scripts/update-cloudflare-ips.sh and reload nginx; Cloudflare announces changes in advance.

