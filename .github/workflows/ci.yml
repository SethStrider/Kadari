# KADARI CI on GitHub — the same jobs as .gitlab-ci.yml (which stays in place for the GitLab mirror).
#
# Jobs are independent (no build artifacts passed between them): each restores from the shared NuGet or pnpm
# cache and builds only what it checks, so a failure points at one thing.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # The pure suites — Domain, Application, Architecture. No container, seconds to run.
  unit-tests:
    name: unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
      - run: >-
          dotnet test Kadari.sln --configuration Release
          --filter "FullyQualifiedName!~Kadari.Infrastructure.Tests"

  # Real Postgres and MinIO through Testcontainers — the runner has a Docker daemon.
  integration-tests:
    name: integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
      - run: >-
          dotnet test tests/Kadari.Infrastructure.Tests/Kadari.Infrastructure.Tests.csproj
          --configuration Release

  # The committed contract is what both TypeScript clients are generated from. An API change that was not
  # re-emitted leaves the clients describing endpoints that no longer exist, so a stale document fails here.
  api-contract:
    name: api contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
      - run: dotnet run --project src/Kadari.WebApi --configuration Release -- --emit-openapi "$GITHUB_WORKSPACE/openapi/v1.json"
      - run: |
          if ! git diff --quiet -- openapi/v1.json; then
            echo "openapi/v1.json is stale. Regenerate it, then the client types:"
            echo "  dotnet run --project src/Kadari.WebApi -- --emit-openapi openapi/v1.json"
            echo "  (cd src/Kadari.Client && pnpm api:types) && (cd src/Kadari.Portal && pnpm api:types)"
            git --no-pager diff -- openapi/v1.json
            exit 1
          fi

  # A model change with no migration only fails at deploy time; catch it at merge instead.
  migration-drift:
    name: migration drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
      - run: dotnet tool install --global dotnet-ef --version "10.*"
      # dotnet-ef builds the startup project but does not restore it.
      - run: dotnet restore src/Kadari.WebApi/Kadari.WebApi.csproj
      - run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Kadari.Infrastructure
          --startup-project src/Kadari.WebApi
          --configuration Release

  # The customer app and the staff portal: generated types match the contract, lint, type-check and build.
  front-end:
    name: front end (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [Kadari.Client, Kadari.Portal]
    defaults:
      run:
        working-directory: src/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: src/${{ matrix.app }}/node_modules
          key: pnpm-${{ matrix.app }}-${{ hashFiles(format('src/{0}/pnpm-lock.yaml', matrix.app)) }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:check
      - run: pnpm lint
      - run: pnpm build
